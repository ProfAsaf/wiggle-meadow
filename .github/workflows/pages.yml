# Deploy Wiggle Meadow to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # index.html is written without a doctype so it can also be published as a Claude artifact;
      # the site build adds one so browsers render in standards mode.
      - name: Build site
        run: |
          mkdir -p _site
          cp -r js icons sw.js manifest.webmanifest _site/
          { echo '<!doctype html>'; echo '<html lang="en">'; cat index.html; } > _site/index.html
          touch _site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
