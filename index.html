<title>Wiggle Meadow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
  :root {
    --ink: #3b2f4a;
    --coral: #ff8a7a;
    --sun: #ffd84f;
    --sky: #74c4ee;
    --cream: #fff1d6;
    --scrim: rgba(59, 47, 74, 0.3);
    --glass: rgba(255, 246, 228, 0.5);
    --glass-edge: rgba(59, 47, 74, 0.28);
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--sky);
    font-family: "Baloo 2", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #title {
    position: fixed; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding-inline: 16px; background: var(--scrim); text-align: center;
  }
  #title h1 {
    margin: 0; font-size: clamp(52px, 11vw, 132px); line-height: 0.95; font-weight: 800; color: #fff;
    letter-spacing: 0.01em; text-wrap: balance;
    text-shadow:
      0 7px 0 var(--ink), 4px 4px 0 var(--ink), -4px 4px 0 var(--ink), 4px -4px 0 var(--ink), -4px -4px 0 var(--ink),
      0 5px 0 var(--ink), 0 -5px 0 var(--ink), 5px 0 0 var(--ink), -5px 0 0 var(--ink);
  }
  #title h1 span { display: inline-block; animation: wiggle 2.4s ease-in-out infinite; }
  #title h1 span:nth-child(3n) { color: var(--sun); }
  #title h1 span:nth-child(3n+1) { color: #fff; }
  #title h1 span:nth-child(3n+2) { color: #ffd0da; }
  @keyframes wiggle {
    0%, 100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-10px) rotate(-5deg); }
    50% { transform: translateY(0) rotate(0); }
    75% { transform: translateY(-4px) rotate(4deg); }
  }
  #title p {
    margin: 0; color: #fff; font-size: clamp(18px, 3vw, 26px); font-weight: 700;
    text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink);
  }
  #play {
    width: 132px; height: 132px; border-radius: 50%; margin-top: 10px; cursor: pointer;
    border: 7px solid var(--ink); background: var(--coral); box-shadow: 0 9px 0 var(--ink);
    display: grid; place-items: center; animation: pulse 1.6s ease-in-out infinite;
  }
  #play:active { transform: translateY(6px); box-shadow: 0 3px 0 var(--ink); }
  @keyframes pulse { 0%, 100% { scale: 1; } 50% { scale: 1.07; } }
  button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

  /* top-right corner: map and sound, small and quiet */
  #hud {
    position: fixed; z-index: 2; display: flex; gap: 10px;
    top: calc(env(safe-area-inset-top, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px);
  }
  .chip {
    width: 48px; height: 48px; padding: 0; cursor: pointer; border-radius: 50%;
    border: 3px solid var(--glass-edge); background: var(--glass);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    display: grid; place-items: center;
  }
  .chip:active, .chip[aria-expanded="true"] { background: var(--cream); border-color: var(--ink); }
  #mute .off { display: none; }
  #mute[aria-pressed="true"] .on { display: none; }
  #mute[aria-pressed="true"] .off { display: block; }

  /* the map opens from its button: tap a square to fly there */
  #map {
    position: absolute; top: 58px; right: 0;
    display: grid; grid-template-columns: repeat(3, 40px); gap: 5px; padding: 8px;
    background: var(--cream); border: 4px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink);
  }
  #map button { width: 40px; height: 30px; padding: 0; cursor: pointer; border: 2px solid var(--ink); border-radius: 8px; position: relative; }
  #map button[aria-current="true"] { box-shadow: 0 0 0 3px var(--coral); }
  #map button[aria-current="true"]::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; background: #fff; border: 2px solid var(--ink);
  }
  #map .space { background: linear-gradient(#1d2860, #4f9fe0); }
  #map .home { background: linear-gradient(#bfe6fa 48%, #90cd63 48%); }
  #map .park { background: linear-gradient(#bfe6fa 48%, #b6e38f 48%); }
  #map .beach { background: linear-gradient(#bfe6fa 48%, transparent 48%), linear-gradient(90deg, #f3dca2 55%, #63c3ee 55%); }
  #map .under { background: linear-gradient(#9b6b4a 40%, #5b3a2b 40%); }

  /* see-through tabs on the screen edges: there's more world this way */
  .nav {
    position: fixed; z-index: 1; padding: 0; cursor: pointer; display: grid; place-items: center;
    border: 3px solid var(--glass-edge); background: var(--glass);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .nav::before { content: ""; position: absolute; inset: -16px; } /* bigger target than it looks */
  .nav:active { background: var(--cream); border-color: var(--ink); }
  .nav svg { opacity: 0.8; }
  #navL, #navR { top: calc(50% - 42px); width: 44px; height: 84px; }
  #navU, #navD { left: calc(50% - 42px); width: 84px; height: 44px; }
  #navL { left: env(safe-area-inset-left, 0px); border-left: 0; border-radius: 0 42px 42px 0; animation: nudgeL 1.2s ease-in-out 0.6s 2; }
  #navR { right: env(safe-area-inset-right, 0px); border-right: 0; border-radius: 42px 0 0 42px; animation: nudgeR 1.2s ease-in-out 0.6s 2; }
  #navU { top: env(safe-area-inset-top, 0px); border-top: 0; border-radius: 0 0 42px 42px; animation: nudgeU 1.2s ease-in-out 0.6s 2; }
  #navD { bottom: env(safe-area-inset-bottom, 0px); border-bottom: 0; border-radius: 42px 42px 0 0; animation: nudgeD 1.2s ease-in-out 0.6s 2; }
  #navR svg { transform: rotate(180deg); }
  #navU svg { transform: rotate(90deg); }
  #navD svg { transform: rotate(-90deg); }
  @keyframes nudgeL { 0%, 100% { translate: 0 0; } 50% { translate: -6px 0; } }
  @keyframes nudgeR { 0%, 100% { translate: 0 0; } 50% { translate: 6px 0; } }
  @keyframes nudgeU { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  @keyframes nudgeD { 0%, 100% { translate: 0 0; } 50% { translate: 0 6px; } }

  @media (prefers-reduced-motion: reduce) {
    #title h1 span, #play, .nav { animation: none; }
  }
</style>

<canvas id="game" aria-label="Wiggle Meadow play scene"></canvas>

<div id="title">
  <h1 aria-label="Wiggle Meadow"><span>W</span><span>i</span><span>g</span><span>g</span><span>l</span><span>e</span> <span>M</span><span>e</span><span>a</span><span>d</span><span>o</span><span>w</span></h1>
  <p>Tap it, drag it, toss it. There's more world past the edges.</p>
  <button id="play" type="button" aria-label="Play">
    <svg width="56" height="60" viewBox="0 0 56 60" aria-hidden="true"><path d="M10 6 L50 30 L10 54 Z" fill="#fff" stroke="#3b2f4a" stroke-width="6" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="hud">
  <button id="mapBtn" class="chip" type="button" aria-label="Map" aria-expanded="false" aria-controls="map" hidden>
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M2 5l7-3 8 3 7-3v19l-7 3-8-3-7 3z" fill="#fff1d6" stroke="#3b2f4a" stroke-width="2.5" stroke-linejoin="round"/><path d="M9 2v19M17 5v19" stroke="#3b2f4a" stroke-width="2.5"/></svg>
  </button>
  <button id="mute" class="chip" type="button" aria-label="Turn sound off" aria-pressed="false" hidden>
    <svg class="on" width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 11h5l7-6v20l-7-6H4z" fill="#3b2f4a"/><path d="M20 10c2 2 2 8 0 10M23.5 7c4 4 4 12 0 16" stroke="#3b2f4a" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
    <svg class="off" width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 11h5l7-6v20l-7-6H4z" fill="#3b2f4a"/><path d="M20 11l7 8M27 11l-7 8" stroke="#3b2f4a" stroke-width="3" stroke-linecap="round"/></svg>
  </button>
  <nav id="map" aria-label="Map" hidden>
    <button type="button" class="space" data-c="0" data-r="0" aria-label="Sky above the house"></button>
    <button type="button" class="space" data-c="1" data-r="0" aria-label="Outer space"></button>
    <button type="button" class="space" data-c="2" data-r="0" aria-label="Sky above the beach"></button>
    <button type="button" class="home" data-c="0" data-r="1" aria-label="House and garden"></button>
    <button type="button" class="park" data-c="1" data-r="1" aria-label="Playground"></button>
    <button type="button" class="beach" data-c="2" data-r="1" aria-label="Beach"></button>
    <button type="button" class="under" data-c="0" data-r="2" aria-label="Burrow"></button>
    <button type="button" class="under" data-c="1" data-r="2" aria-label="Mole tunnels"></button>
    <button type="button" class="under" data-c="2" data-r="2" aria-label="Treasure cave"></button>
  </nav>
</div>

<button id="navL" class="nav" type="button" aria-label="Go left" hidden><svg width="24" height="24" viewBox="0 0 34 34" aria-hidden="true"><path d="M21 6 L9 17 L21 28" fill="none" stroke="#3b2f4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="navR" class="nav" type="button" aria-label="Go right" hidden><svg width="24" height="24" viewBox="0 0 34 34" aria-hidden="true"><path d="M21 6 L9 17 L21 28" fill="none" stroke="#3b2f4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="navU" class="nav" type="button" aria-label="Go up" hidden><svg width="24" height="24" viewBox="0 0 34 34" aria-hidden="true"><path d="M21 6 L9 17 L21 28" fill="none" stroke="#3b2f4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button id="navD" class="nav" type="button" aria-label="Go down" hidden><svg width="24" height="24" viewBox="0 0 34 34" aria-hidden="true"><path d="M21 6 L9 17 L21 28" fill="none" stroke="#3b2f4a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
